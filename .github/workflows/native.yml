name: Native core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Configure independent C++ core
        run: cmake -S native -B native/build-cmake -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build native/build-cmake --config Release --parallel 2 --target coaster_cli coaster_convergence fvd_tests baseline_jets_tests flow_bridge_tests connector_profile_tests support_tests structures_tests geometry_tests frame_force_tests convergence_tests drive_profile_tests
      - name: Test changed authoring and real CLI contracts
        run: ctest --test-dir native/build-cmake -C Release --output-on-failure --parallel 2 --stop-on-failure --timeout 600 -R "^(fvd|baseline_jets|flow_bridge|connector_profile|cli_arguments|geometry|frame_force|convergence|drive_profile)$"
      - name: Check seed 42 controls and flat 39 regression at 960 and 1920 Hz
        shell: python
        run: |
          import json, platform, subprocess
          from pathlib import Path
          output = Path('ride-checks')
          output.mkdir()
          executable = Path('native/build-cmake') / ('Release/coaster_cli.exe' if platform.system() == 'Windows' else 'coaster_cli')
          print(f'Native host: {platform.system()} {platform.machine()}', flush=True)
          failed = False
          for seed, terrain, candidates in [(42, 'flat', 1), (42, 'hills', 1), (39, 'flat', 8)]:
              name = output / f'{terrain}-{seed}'
              with Path(f'{name}.log').open('w') as stdout, Path(f'{name}-progress.log').open('w') as stderr:
                  result = subprocess.run([str(executable), 'generate', '--seed', str(seed), '--terrain', terrain,
                      '--preset', 'physics-proof', '--candidates', str(candidates), '--json', f'{name}.json',
                      '--plan', f'{name}-plan.json', '--trace', f'{name}-trace.json', '--out', f'{name}.coaster'],
                      stdout=stdout, stderr=stderr, timeout=600)
              failed |= result.returncode != 0
              report = json.loads(Path(f'{name}.json').read_text())
              print(f'{terrain}/{seed}: accepted={report["accepted"]} generationSeconds={report["generationSeconds"]}', flush=True)
          if failed:
              raise SystemExit('A ride failed its unchanged acceptance gates. See ride-checks.')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ride-checks-${{ runner.os }}
          path: ride-checks

# UE cooking and Mac/Metal runtime verification require suitable engine hosts.
# Performance benchmarks are deliberately absent from this workflow.
