name: Native Windows and macOS checks

on:
  push:
    paths-ignore: ['docs/**', '*.md', '*.lnk']
  pull_request:
    paths-ignore: ['docs/**', '*.md', '*.lnk']
  workflow_dispatch:
    inputs:
      run-corpus:
        description: Run the three-seed ride-feel corpus and integration suite
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.platform }} checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-2022
            cli: native/build-ci/Release/coaster_cli.exe
          - platform: macOS
            os: macos-15
            cli: native/build-ci/coaster_cli
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 1
      COASTER_CLI: ${{ matrix.cli }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Configure C++20 native core on Windows
        if: runner.os == 'Windows'
        run: >-
          cmake -S native -B native/build-ci
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_CXX_STANDARD=20
      - name: Configure C++20 native core on macOS
        if: runner.os == 'macOS'
        run: >-
          cmake -S native -B native/build-ci
          -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_STANDARD=20
      - name: Build one compiler worker
        run: cmake --build native/build-ci --config Release --parallel 1
      - name: Run component boundary tests
        run: >-
          ctest --test-dir native/build-ci -C Release
          --output-on-failure --parallel 1 --timeout 600
          -L component --output-junit component-tests.xml
      - name: Generate one accepted baseline per push
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'ride-checks'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $cli = Join-Path $PWD $env:COASTER_CLI
          $json = Join-Path $out 'baseline-42.json'
          $plan = Join-Path $out 'baseline-42-plan.json'
          $trace = Join-Path $out 'baseline-42-trace.json'
          $save = Join-Path $out 'baseline-42.coaster'
          & $cli generate --preset default --seed 42 --terrain highlands `
            --json $json --plan $plan --trace $trace --out $save `
            1> (Join-Path $out 'baseline-42.stdout.log') `
            2> (Join-Path $out 'baseline-42.progress.log')
          if ($LASTEXITCODE -ne 0) { throw "Baseline generation failed with exit code $LASTEXITCODE" }
          $report = Get-Content -Raw -LiteralPath $json | ConvertFrom-Json
          if (-not $report.accepted -or -not $report.convergence.passed -or -not $report.motionAudit.passed) {
            throw 'Baseline did not pass the native acceptance and convergence gates'
          }
          Write-Host ("baseline-42 accepted={0} generationSeconds={1}" -f $report.accepted, $report.generationSeconds)
      - name: Export interactive ride review
        run: |
          python native/tools/ride_review.py ride-checks/baseline-42 --out ride-checks/baseline-42-review.html
          if ($LASTEXITCODE -ne 0) { throw 'Could not export the generated ride review' }
      - name: Check ride feel and fresh saved-design replay
        run: |
          $tests = if ($IsWindows) { 'native/build-ci/Release/ride_feel_tests.exe' } else { 'native/build-ci/ride_feel_tests' }
          & $tests --design ride-checks/baseline-42.coaster
          if ($LASTEXITCODE -ne 0) { throw 'Generated ride failed experience regression budgets' }
      - name: Run full integration suite at a checkpoint
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run-corpus == true) || contains(github.event.head_commit.message, '[checkpoint]') }}
        run: >-
          ctest --test-dir native/build-ci -C Release
          --output-on-failure --parallel 1 --timeout 600
          -L integration --output-junit integration-tests.xml
      - name: Run two additional ride-feel seeds at a checkpoint
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run-corpus == true) || contains(github.event.head_commit.message, '[checkpoint]') }}
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'corpus-checks'
          New-Item -ItemType Directory -Path $output | Out-Null
          $cli = Join-Path $PWD $env:COASTER_CLI
          $tests = if ($IsWindows) { 'native/build-ci/Release/ride_feel_tests.exe' } else { 'native/build-ci/ride_feel_tests' }
          foreach ($seed in @(7, 99)) {
            $save = Join-Path $output "seed-$seed.coaster"
            & $cli generate --seed $seed --terrain highlands --out $save --json (Join-Path $output "seed-$seed.json") `
              1> (Join-Path $output "seed-$seed.stdout.log") 2> (Join-Path $output "seed-$seed.progress.log")
            if ($LASTEXITCODE -ne 0) { throw "Seed $seed did not generate an accepted ride" }
            & $tests --design $save
            if ($LASTEXITCODE -ne 0) { throw "Seed $seed failed experience regression budgets" }
          }
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-checks
          path: |
            ride-checks
            corpus-checks
            native/build-ci/*-tests.xml
            native/build-ci/Testing/Temporary
