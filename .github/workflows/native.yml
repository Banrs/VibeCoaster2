name: Native core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Configure independent C++ core
        run: cmake -S native -B native/build-cmake -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build native/build-cmake --config Release --parallel 2 --target coaster_cli fvd_tests layout_modules_tests baseline_jets_tests flow_bridge_tests connector_profile_tests
      - name: Test changed authoring and real CLI contracts
        run: ctest --test-dir native/build-cmake -C Release --output-on-failure --parallel 2 --stop-on-failure --timeout 600 -R "^(fvd|layout_modules|baseline_jets|flow_bridge|connector_profile|cli_arguments)$"
      - name: Check representative complete rides at 960 and 1920 Hz
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ride-checks | Out-Null
          $failed = $false
          foreach ($terrain in @('flat', 'hills')) {
            & ./native/build-cmake/Release/coaster_cli.exe generate --seed 42 --terrain $terrain --preset physics-proof --candidates 1 --json "ride-checks/$terrain.json" --plan "ride-checks/$terrain-plan.json" --trace "ride-checks/$terrain-trace.json" --out "ride-checks/$terrain.coaster" > "ride-checks/$terrain.log"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'A representative ride failed its unchanged acceptance gates. See ride-checks.' }
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: ride-checks
          path: ride-checks

# UE cooking and Mac/Metal runtime verification require suitable engine hosts.
# Performance benchmarks are deliberately absent from this workflow.
